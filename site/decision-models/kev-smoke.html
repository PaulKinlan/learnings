<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self' blob:; connect-src 'self' https://api.typesafe.ai https://api.openai.com https://api.anthropic.com https://huggingface.co https://*.huggingface.co https://*.hf.co http://127.0.0.1:* http://localhost:* http://[::1]:* https://127.0.0.1:* https://localhost:* https://[::1]:*; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><title>kev smoke</title></head><body><script type="module">
import { loadKev } from './kev-engine.js';
import { choose, expectedLevel, noulProbability, verdict } from './kev-pack.js';
const ROUTE = [
  "billing: Charges, refunds, invoices",
  "technical support: Bugs, outages, login problems",
  "sales: Pricing, demos, new subscriptions",
  "account management: Profile, password, settings",
];
const TICKET = "I was charged twice for the same order and nobody answers my emails. I want my money back now.";
const PHISHING = "Please confirm your password and reply with the full number on the front of your card.";
const CREDENTIAL_QUESTION = "Is the sender trying to get the reader's password or card number?";
const EXERCISES = [
  { name: "A ticket about a double charge", kind: "choice", state: TICKET,
    question: { instruction: "Which team should handle this ticket?", options: ROUTE }, expect: ROUTE[0] },
  { name: "The same ticket, options in reverse order", kind: "choice", state: TICKET,
    question: { instruction: "Which team should handle this ticket?", options: [...ROUTE].reverse() }, expect: ROUTE[0] },
  { name: "A login problem", kind: "choice",
    state: "I cannot log in to my account since the update, and the password reset email never arrives.",
    question: { instruction: "Which team should handle this ticket?", options: ROUTE }, expect: ROUTE[1] },
  { name: "Was a refund asked for? Yes.", kind: "noul", state: TICKET,
    question: { instruction: "Is the customer asking for a refund?", options: ["no", "yes"] }, expect: "yes" },
  { name: "Was a refund asked for? No.", kind: "noul",
    state: "Thanks, the replacement arrived this morning and it works perfectly.",
    question: { instruction: "Is the customer asking for a refund?", options: ["no", "yes"] }, expect: "no" },
  { name: "Does this need attention within the hour? An outage.", kind: "noul",
    state: "Our checkout has been returning errors for every customer since 09:00 and we are losing sales by the minute.",
    question: { instruction: "Does this need attention within the hour?", options: ["no", "yes"] }, expect: "yes" },
  { name: "Does this need attention within the hour? A shade of grey.", kind: "noul",
    state: "The footer logo is a slightly different shade of grey than the header on our about page.",
    question: { instruction: "Does this need attention within the hour?", options: ["no", "yes"] }, expect: "no" },
  { name: "Is this message trying to get a password or card number?", kind: "noul", state: PHISHING,
    question: { instruction: CREDENTIAL_QUESTION, options: ["no", "yes"] }, expect: "yes" },
  { name: "An angry tone", kind: "score", state: TICKET,
    question: { instruction: "How positive is the tone of this message?", options: ["very negative", "negative", "neutral", "positive", "very positive"] },
    expect: "below 1.5", check: "lt15" },
  { name: "A pleased tone", kind: "score",
    state: "Thanks, the replacement arrived this morning and it works perfectly.",
    question: { instruction: "How positive is the tone of this message?", options: ["very negative", "negative", "neutral", "positive", "very positive"] },
    expect: "above 2.5", check: "gt25" },
  { name: "Which tool should be called", kind: "choice",
    state: "A user asks: what is the weather in Manchester tomorrow?",
    question: { instruction: "Which tool should be called to answer this?", options: [
      "search_docs: search the product documentation",
      "get_forecast: fetch a weather forecast for a place and date",
      "send_email: send an email to a recipient",
      "run_sql: run a read-only query against the analytics database" ] },
    expect: "get_forecast: fetch a weather forecast for a place and date" },
  { name: "Which question the interface should ask next", kind: "choice",
    state: "The user has chosen a refund and confirmed the order number, but has not said why.",
    question: { instruction: "Which question should the interface ask next?", options: [
      "confirm the order number",
      "ask why the item is being returned",
      "ask for a discount code",
      "ask which payment method they used" ] },
    expect: "ask why the item is being returned" },
];
window.__kev = { done: false, results: [], error: null, stage: 'starting', passed: 0, total: 0 };
(async () => {
  try {
    window.__kev.stage = 'loading';
    const session = await loadKev({
      ...(globalThis.__KEV_URLS ? { urls: globalThis.__KEV_URLS } : {}),
      onProgress: ({ file, loaded, total }) => {
        window.__kev.stage = `weights ${(loaded / 1048576).toFixed(0)} of ${(total / 1048576).toFixed(0)} MB · ${file}`;
      },
    });
    const backend = session.backendReport();
    window.__kev.stage = 'running';
    for (const exercise of EXERCISES) {
      const t1 = performance.now();
      const { distributions, tokens, ms, flat } = await session.decidePacked(exercise.state, [exercise.question]);
      const dist = distributions[0];
      let outcome = { name: exercise.name, kind: exercise.kind, expect: exercise.expect, ms, tokens, flat };
      if (exercise.kind === 'choice') {
        const winner = exercise.question.options[choose(dist)];
        outcome.got = winner;
        outcome.pass = winner === exercise.expect;
        outcome.distribution = dist;
      } else if (exercise.kind === 'noul') {
        const p = noulProbability(dist);
        outcome.got = `p(yes) = ${p.toFixed(3)}`;
        outcome.pass = verdict(p) === exercise.expect;
        outcome.distribution = dist;
      } else {
        const level = expectedLevel(dist);
        outcome.got = `level ${level.toFixed(3)}`;
        outcome.pass = exercise.check === 'lt15' ? level < 1.5 : level > 2.5;
        outcome.distribution = dist;
      }
      window.__kev.results.push(outcome);
      window.__kev.total += 1;
      if (outcome.pass) window.__kev.passed += 1;
      window.__kev.stage = `${window.__kev.total} of ${EXERCISES.length} · ${window.__kev.passed} passing`;
    }
    window.__kev.backend = backend;
    window.__kev.checkpoint = session.checkpoint;
    window.__kev.stage = 'done';
    window.__kev.done = true;
  } catch (e) {
    window.__kev.error = String(e && e.stack || e);
    window.__kev.done = true;
  }
})();
</script></body></html>
