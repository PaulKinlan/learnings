const QT = {0: 'choice', 1: 'score', 2: 'noul'};

async function runVariant(name) {
  const graphUrl = './laya/laya_ml_s256_' + name + '.tflite';
  const session = await loadLaya({
    checkpoint: 'multilingual', calibration: 'source', window: 256,
    urls: {
      'laya_ml_s512_embeds_wfp16.tflite': graphUrl,
      'token_embeddings_fp16.bin': './laya/token_embeddings_fp16.bin',
      'tokenizer.json': './laya/ml-tokenizer.json',
      'SHA256SUMS': './laya/ml-SHA256SUMS',
      'laya_ml_act_head_fp32.tflite': './laya/laya_ml_act_head_fp32.tflite',
      'laya_ml_calibration.json': './laya/laya_ml_calibration.json',
    },
  });
  const out = [];
  for (const row of SAMPLE) {
    const q = row.question;
    const question = { t: QT[row.qtype], ins: q.instructions, crit: q.criteria ?? {} };
    const t1 = performance.now();
    const { answer } = await session.decide(row.state, question);
    out.push({ row_id: row.row_id, ms: Math.round(performance.now() - t1), answer, official: row.official_answer });
  }
  session.delete();
  window.__quant.variants[name] = out;
}

(async () => {
  try {
